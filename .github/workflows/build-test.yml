name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # chạy tay từ GitHub Actions tab

jobs:
  # ============================================================
  # JOB 0 — LẤY LICENSE (chỉ chạy khi bấm Run workflow bằng tay)
  # Bạn CHƯA có secret UNITY_LICENSE thì làm theo 4 bước:
  #   1. Tab Actions → chọn workflow này → Run workflow (bấm tay)
  #   2. Job "Request activation file 🔑" → tải artifact "Unity Activation File" → file .alf
  #   3. Mở https://license.unity3d.com/manual → upload .alf → Unity Personal → tải .ulf
  #   4. Mở .ulf bằng notepad → copy TOÀN BỘ → GitHub Settings → Secrets → Actions
  #      → New repository secret → tên: UNITY_LICENSE → paste → Add secret
  # Xong secret là test/build chạy được, không cần email/password nữa.
  # ============================================================
  request-activation-file:
    name: Request activation file 🔑
    if: github.event_name == 'workflow_dispatch' # chỉ chạy khi bấm tay — không chạy mỗi push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 🔍 Chẩn đoán secrets (không hiện giá trị)
        run: |
          if [ -n "${{ secrets.UNITY_EMAIL }}" ]; then echo "UNITY_EMAIL   : ✅ SET"; else echo "UNITY_EMAIL   : ❌ EMPTY"; fi
          if [ -n "${{ secrets.UNITY_PASSWORD }}" ]; then echo "UNITY_PASSWORD: ✅ SET"; else echo "UNITY_PASSWORD: ❌ EMPTY"; fi
          if [ -n "${{ secrets.UNITY_SERIAL }}" ]; then echo "UNITY_SERIAL  : ✅ SET"; else echo "UNITY_SERIAL  : ⚪ BỎ QUA (Personal không cần)"; fi

      - name: Unity - Request activation file
        uses: game-ci/unity-activate@v2 # CHỈ có v2 — v3 không tồn tại (CI fail "Set up job" 2026-08-15)
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

      - name: Upload activation file
        uses: actions/upload-artifact@v4
        with:
          name: Unity Activation File
          path: activation
          if-no-files-found: ignore # license đã có sẵn thì không sinh .alf — không fail

  test:
    name: Unity Test Runner (EditMode + PlayMode)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Test-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Test-

      - name: Run Tests
        uses: game-ci/unity-test-runner@v4 # tự activate từ UNITY_LICENSE — không cần bước riêng
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: .
          unityVersion: 6000.4.5f1
          testMode: all
          artifactsPath: artifacts/test-results

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test Results
          path: artifacts/test-results

  build-webgl:
    name: Build WebGL (Gzip)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4 # tự activate từ UNITY_LICENSE — không cần bước riêng
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: .
          unityVersion: 6000.4.5f1
          targetPlatform: WebGL

      - name: Upload WebGL Build
        uses: actions/upload-artifact@v4
        with:
          name: WebGL Build (Gzip)
          path: build/WebGL
